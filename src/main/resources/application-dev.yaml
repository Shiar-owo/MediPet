spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  docker:
    compose:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans

jwt:
  secret: super0secret0password
  access-expiration: 900000
  refresh-expiration: 604800000
