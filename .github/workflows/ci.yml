name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw test -B

      - name: Build JAR
        run: ./mvnw clean package -DskipTests -B

      - name: Build Docker image
        run: docker build -t medipet .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: medipet-jar
          path: target/medipet-*.jar
          retention-days: 5
